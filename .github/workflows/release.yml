name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests/test_diskdb.py
      - run: pip install pyinstaller==6.22.3
      - run: pyinstaller --noconfirm --onefile --windowed --name ResolveProjectCreator --paths src run.py
      - uses: actions/upload-artifact@v4
        with:
          name: ResolveProjectCreator
          path: dist/ResolveProjectCreator.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ResolveProjectCreator.exe
